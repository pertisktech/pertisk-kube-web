# Pertisk Kubernetes dashboard (RPM/DEB install)

# HTTP API + UI
APP_PORT=8091
# gRPC watch API
GRPC_PORT=50051

# Built-in SPA assets
STATIC_DIR=/usr/share/pertisk-kube/static

# Basic auth for the dashboard. Set real values during installation.
USERNAME=admin
PASSWORD=CHANGE_ME_SET_AT_INSTALL
JWT_SECRET=CHANGE_ME_SET_AT_INSTALL

# Logging
RUST_LOG=info

# Optional at install time. The service starts without a cluster and you can
# upload/select a kubeconfig later from the UI (Connect cluster).
# Uploads are written here (must be writable by the service user):
KUBECONFIG=/var/lib/pertisk-kube/kubeconfig
