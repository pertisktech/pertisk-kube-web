 [package]
 name = "pertisk-kube-backend"
 version = "0.1.0"
 edition = "2021"

 [dependencies]
 axum = { version = "0.7", features = ["macros", "json", "ws"] }
 hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util"] }
 serde = { version = "1", features = ["derive"] }
 serde_json = "1"
serde_yaml = "0.9"
 thiserror = "1"
anyhow = "1"
 tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
 tracing = "0.1"
 tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
 kube = { version = "0.91", features = ["runtime", "derive"] }
 k8s-openapi = { version = "0.22", features = ["v1_30"] }
 base64 = "0.22"
 chrono = { version = "0.4", default-features = true }
 cron = "0.12"
flate2 = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
 jsonwebtoken = "9"
tonic = "0.11"
prost = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
tonic-web = "0.11"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
portable-pty = "0.8"
wtransport = { version = "0.7", features = ["self-signed"] }
x509-parser = "0.16"
sha2 = "0.10"
rustls-pemfile = "2"
once_cell = "1"

[build-dependencies]
tonic-build = "0.11"

