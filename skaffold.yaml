apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: pertisk-kube

build:
  artifacts:
    - image: harbor.tools.pertisk.com/pertisksoft/pertisk-kube/web
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VERSION: "{{.IMAGE_TAG}}"
  tagPolicy:
    envTemplate:
      template: "{{.FOUR_DIGIT_TAG}}"
  local:
    push: true

deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 900
  helm:
    releases:
      - name: pertisk-kube
        chartPath: ./helm/pertisk-kube
        namespace: pertisk-rproxy
        createNamespace: true
        setValueTemplates:
          app.image.tag: "{{.IMAGE_TAG_harbor_tools_pertisk_com_pertisksoft_pertisk_kube_web}}"

# Profiles
profiles:
  # Production: uses git tags for versioning and prod values
  - name: prod
    build:
      tagPolicy:
        gitCommit:
          variant: Tags
    deploy:
      helm:
        releases:
          - name: pertisk-kube
            chartPath: ./helm/pertisk-kube
            namespace: pertisk-rproxy
            createNamespace: true
            valuesFiles:
              - helm/pertisk-kube/values-prod.yaml
            setValueTemplates:
              app.image.tag: "{{.IMAGE_TAG_harbor_tools_pertisk_com_pertisksoft_pertisk_kube_web}}"
