# Default values for pertisk-kube unified deployment

# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

namespace:
  # Whether to create the namespace (use with --create-namespace flag)
  create: false

# Unified application configuration
app:
  name: pertisk-kube
  replicaCount: 3
  image:
    registry: harbor.tools.thaidevops.co
    repository: pertisksoft/pertisk-kube/web
    tag: "v0.0.4"
    pullPolicy: Always
  service:
    # ClusterIP (default) — use with Ingress. Or LoadBalancer for direct access via IP:port (no domain).
    type: ClusterIP
    port: 8091
    targetPort: 8091
    grpcPort: 50051
    grpcTargetPort: 50051
  env:
    rustLog: info
  auth:
    username: admin
    password: admin
    jwtSecret: "a64543d6-19cf-11f1-a3d1-768d4c051e08"  # Change this in production!
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  minReadySeconds: 10
  terminationGracePeriodSeconds: 30
  podAntiAffinity: true
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /api/readiness
      port: 8091
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Ingress configuration
ingress:
  enabled: true
  className: "pertisk-rproxy"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  hosts:
    - host: dashboard.talos.thaidevops.co
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: admin-talos-tls
      hosts:
        - dashboard.talos.thaidevops.co

ingressGrpc:
  enabled: false

# PodDisruptionBudget — keeps at least 1 pod available during node drains / rolling updates
pdb:
  enabled: true
  minAvailable: 1

# Leader election via Kubernetes Lease — allows one pod to act as leader for singleton tasks
leaderElection:
  enabled: true
  leaseName: pertisk-kube-leader
  # Optionally pre-create the Lease object used by leader election.
  createLease: true
  leaseDurationSeconds: 30
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /kubernetes.KubernetesWatch/
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

# RBAC configuration — aligned with all app features (list/get/watch/update/patch/delete, exec, port-forward, etc.)
rbac:
  create: true
  serviceAccountName: pertisk-kube-sa
  rules:
    # Core resources - read
    - apiGroups: [""]
      resources:
        [
          "services",
          "endpoints",
          "nodes",
          "events",
          "persistentvolumeclaims",
          "persistentvolumes",
          "configmaps",
          "secrets",
          "serviceaccounts",
          "limitranges",
          "resourcequotas",
        ]
      verbs: ["get", "list", "watch"]
    # Core resources - write (Config, Services, Endpoints, Nodes, ServiceAccounts)
    - apiGroups: [""]
      resources:
        [
          "configmaps",
          "secrets",
          "limitranges",
          "resourcequotas",
          "services",
          "endpoints",
          "nodes",
          "serviceaccounts",
        ]
      verbs: ["update", "patch", "delete"]
    # Pods - full manage + log
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Pod attach - required by kubectl debug/node shell attach flow
    - apiGroups: [""]
      resources: ["pods/attach"]
      verbs: ["create"]
    # Pod exec - terminal/shell
    - apiGroups: [""]
      resources: ["pods/exec"]
      verbs: ["create"]
    # Pod port-forward - port forwarding feature
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["create"]
    # Namespaces
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "delete"]
    # Apps
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Batch
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Networking - full manage
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies", "ingressclasses"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Storage - read
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers", "csistoragecapacities"]
      verbs: ["get", "list", "watch"]
    # Storage - write (PV, PVC, StorageClass)
    - apiGroups: [""]
      resources: ["persistentvolumes", "persistentvolumeclaims"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # RBAC - full manage
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Autoscaling - full manage
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Policy - full manage (PDB)
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets", "podsecuritypolicies"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Scheduling - full manage
    - apiGroups: ["scheduling.k8s.io"]
      resources: ["priorityclasses"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Node (runtime classes) - full manage
    - apiGroups: ["node.k8s.io"]
      resources: ["runtimeclasses"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Coordination (leases) - full manage
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Admission registration - MWC / VWC
    - apiGroups: ["admissionregistration.k8s.io"]
      resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Metrics (read-only)
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods", "nodes"]
      verbs: ["get", "list", "watch"]
    # CRD definitions
    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list", "watch"]
    # CRD instances - custom resources
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
