# Default values for pertisk-kube unified deployment

# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

namespace:
  # Whether to create the namespace (use with --create-namespace flag)
  create: false

# Unified application configuration
app:
  name: pertisk-kube
  replicaCount: 3
  image:
    registry: harbor.tools.thaidevops.co
    repository: pertisksoft/pertisk-kube/web
    tag: "v0.0.4"
    pullPolicy: Always
  service:
    # ClusterIP (default) — use with Ingress. Or LoadBalancer for direct access via IP:port (no domain).
    type: ClusterIP
    port: 8091
    targetPort: 8091
    grpcPort: 50051
    grpcTargetPort: 50051
    # WebTransport (QUIC over UDP): port must be exposed as UDP in Service/LB so QUIC packets reach the pod.
    webtransportPort: 50052
    webtransportTargetPort: 50052
  # WebTransport: enable server and optional public URL for frontend (from env).
  # Set publicUrl so the frontend gets the WebTransport URL from GET /api/config (no rebuild needed).
  webtransport:
    enabled: true
    # Public URL for WebTransport. Must point to a server that speaks HTTP/3 + WebTransport (or a proxy that forwards to it).
    # When exposing WT directly (exposeLoadBalancer or main Service LoadBalancer): include :port (e.g. https://wt.example.com:50052).
    publicUrl: "https://wt.talos-hz.thaidevops.co"  # include :50052 when traffic is directed to exposed port 50052
    # TLS for WebTransport server: mount cert from this secret (must have tls.crt and tls.key). Same idea as local run with certs/.
    # If set, backend uses these certs instead of self-signed; hostname in cert should match publicUrl host.
    tlsSecretName: "admin-talos-hz-tls"  # e.g. "admin-talos-hz-tls" or "" to use self-signed
    # Expose WebTransport (UDP) via a dedicated LoadBalancer so external clients can connect to port 50052. Set publicUrl to https://<host>:50052.
    exposeLoadBalancer: false  # set true to create a second Service (LoadBalancer) for 50052/UDP only
  env:
    rustLog: info
  auth:
    username: admin
    password: admin
    jwtSecret: "a64543d6-19cf-11f1-a3d1-768d4c051e08"  # Change this in production!
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  minReadySeconds: 10
  terminationGracePeriodSeconds: 30
  podAntiAffinity: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /api/readiness
      port: 8091
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Ingress: single domain (one host, path /). Template adds WebSocket annotations for /ws and /api/exec.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

ingressGrpc:
  enabled: false

# Optional: second domain for WebTransport (e.g. wt.dashboard.example.com → backend 8443).
# Backend must have TLS cert for this host (WEBTRANSPORT_HOSTNAMES or cert). Ingress controller
# should use TLS/QUIC passthrough for this host so backend receives the raw connection.
# Optional: set app.webtransport.publicUrl so frontend gets the URL from /api/config (no rebuild).
# Or build frontend with VITE_WEBTRANSPORT_URL=https://<host below>.
ingressWebtransport:
  enabled: false
  className: "pertisk-rproxy"
  annotations: {}
  hosts:
    - host: wt.talos-hz.thaidevops.co
  tls:
    - secretName: admin-talos-hz-tls
      hosts:
        - "wt.talos-hz.thaidevops.co"

# PodDisruptionBudget — keeps at least 1 pod available during node drains / rolling updates
pdb:
  enabled: true
  minAvailable: 1

# Leader election via Kubernetes Lease — allows one pod to act as leader for singleton tasks
leaderElection:
  enabled: true
  leaseName: pertisk-kube-leader
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /kubernetes.KubernetesWatch/
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

# RBAC configuration
rbac:
  create: true
  serviceAccountName: pertisk-kube-sa
  rules:
    # Core resources - Read-only for most
    - apiGroups: [""]
      resources:
        [
          "services",
          "endpoints",
          "nodes",
          "events",
          "persistentvolumeclaims",
          "persistentvolumes",
          "configmaps",
          "secrets",
          "serviceaccounts",
          "limitranges",
          "resourcequotas",
        ]
      verbs: ["get", "list", "watch"]
    # Pods - Allow editing and deleting
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Namespaces - Allow deleting
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "delete"]
    # Apps resources - Allow editing and deleting
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Batch resources - Allow editing and deleting
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
    # Networking resources
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies", "ingressclasses"]
      verbs: ["get", "list", "watch"]
    # Storage resources
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers", "csistoragecapacities"]
      verbs: ["get", "list", "watch"]
    # RBAC Access Control resources
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list", "watch"]
    # Autoscaling resources
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    # Policy resources
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets", "podsecuritypolicies"]
      verbs: ["get", "list", "watch"]
    # Scheduling resources
    - apiGroups: ["scheduling.k8s.io"]
      resources: ["priorityclasses"]
      verbs: ["get", "list", "watch"]
    # Node resources
    - apiGroups: ["node.k8s.io"]
      resources: ["runtimeclasses"]
      verbs: ["get", "list", "watch"]
    # Coordination resources - read cluster-wide leases
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch"]
    # Metrics
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods", "nodes"]
      verbs: ["get", "list", "watch"]
    # CRD definitions - needed to list/read CustomResourceDefinitions
    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list", "watch"]
    # CRD instances - allow reading and managing custom resources across all groups
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["get", "list", "watch", "update", "patch", "delete"]
