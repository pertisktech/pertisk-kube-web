# Production values for pertisk-kube unified deployment

# Override the chart name (optional)
nameOverride: ""
# Override the full name (optional)
fullnameOverride: ""

namespace:
  # Whether to create the namespace (use with --create-namespace flag)
  create: false

app:
  name: pertisk-kube
  replicaCount: 3  # Increase replicas for HA
  image:
    registry: harbor.tools.pertisk.com
    repository: pertisksoft/pertisk-kube/web
    tag: v1.0.0  # Use specific version tags instead of latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8091
    targetPort: 8091
  env:
    rustLog: info
    backupExternalCrdEnabled: "true"
  auth:
    username: admin
    password: "" # Set with --set app.auth.password=... or a private values file
    jwtSecret: "" # Set with --set app.auth.jwtSecret=... or a private values file
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /api/readiness
      port: 8091
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: pertisk-kube.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.yourdomain.com

rbac:
  create: true
  serviceAccountName: pertisk-kube-sa
  rules:
    # Core resources
    - apiGroups: [""]
      resources: ["pods", "pods/log", "services", "endpoints", "nodes", "namespaces", "events", "persistentvolumeclaims", "persistentvolumes", "configmaps", "secrets", "serviceaccounts", "limitranges", "resourcequotas"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Pod attach/exec/port-forward for terminal and debug features
    - apiGroups: [""]
      resources: ["pods/attach", "pods/exec", "pods/portforward"]
      verbs: ["create"]
    # Apps resources
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    # Batch resources
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    # Networking resources
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies", "ingressclasses"]
      verbs: ["get", "list", "watch"]
    # Storage resources
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers", "csistoragecapacities"]
      verbs: ["get", "list", "watch"]
    # RBAC Access Control resources
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list", "watch"]
    # Autoscaling resources
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    # Policy resources
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets", "podsecuritypolicies"]
      verbs: ["get", "list", "watch"]
    # Scheduling resources
    - apiGroups: ["scheduling.k8s.io"]
      resources: ["priorityclasses"]
      verbs: ["get", "list", "watch"]
    # Node resources
    - apiGroups: ["node.k8s.io"]
      resources: ["runtimeclasses"]
      verbs: ["get", "list", "watch"]
    # Coordination resources
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "list", "watch"]
    # Metrics
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods", "nodes"]
      verbs: ["get", "list", "watch"]
