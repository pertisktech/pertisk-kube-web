{{- /* Expose WebTransport via LoadBalancer so clients connect directly (no reverse proxy). Point publicUrl to https://<host>:<webtransportPort>. QUIC uses UDP; TCP same port for stacks that expect both. */}}
{{- if and .Values.app.webtransport.enabled .Values.app.webtransport.exposeLoadBalancer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pertisk-kube.fullname" . }}-webtransport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-kube.labels" . | nindent 4 }}
    app: {{ .Values.app.name }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: wt-tcp
      port: {{ .Values.app.service.webtransportPort }}
      targetPort: {{ .Values.app.service.webtransportTargetPort }}
      protocol: TCP
    - name: wt-udp
      port: {{ .Values.app.service.webtransportPort }}
      targetPort: {{ .Values.app.service.webtransportTargetPort }}
      protocol: UDP
  {{- if .Values.app.webtransport.loadBalancerDualStack }}
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  {{- end }}
{{- end }}
