apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-kube.labels" . | nindent 4 }}
    app: {{ .Values.app.name }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.app.service.grpcPort }}
      targetPort: {{ .Values.app.service.grpcTargetPort }}
      protocol: TCP
    {{- if .Values.app.webtransport.enabled }}
    # WebTransport (QUIC) uses UDP; TCP here would not reach the server.
    - name: webtransport
      port: {{ .Values.app.service.webtransportPort }}
      targetPort: {{ .Values.app.service.webtransportTargetPort }}
      protocol: UDP
    {{- end }}
