apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-kube.labels" . | nindent 4 }}
    app: {{ .Values.app.name }}
spec:
  type: {{ .Values.app.service.type }}
  # Sticky sessions keep long-lived WebSocket / exec / log streams on one pod.
  sessionAffinity: {{ .Values.app.service.sessionAffinity | default "ClientIP" }}
  {{- if eq (.Values.app.service.sessionAffinity | default "ClientIP") "ClientIP" }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.app.service.sessionAffinityTimeoutSeconds | default 10800 }}
  {{- end }}
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.app.service.grpcPort }}
      targetPort: {{ .Values.app.service.grpcTargetPort }}
      protocol: TCP
