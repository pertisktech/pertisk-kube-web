apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-world-cron
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello-world-container
            image: busybox:1.28
            command:
            - /bin/sh
            - -c
            - date; echo "Hello, World from Kubernetes!"
          restartPolicy: OnFailure